<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico SVG</title>
</head>

<body>

    <h1>Gráfico SVG</h1>

    <svg width="100" height="100">
        <circle r="40" cx ="50" cy="50" fill ="yellow" stroke="green" stroke-width="4">

        <animate
            attributeName="cx"
            begin="0s"
            dur="1s"
            from="0"
            to="20%"
            repeatCount="indefinite" />

        </circle>
    </svg>


    <h2>ejemplo con img</h2>
    <img src="circulo.svg" alt="">
